name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkme_db
          POSTGRES_USER: linkme
          POSTGRES_PASSWORD: linkme_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkme -d linkme_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:7.4.0-v3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      DEBUG: "True"
      ENVIRONMENT: development
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_NAME: linkme_db
      DATABASE_USER: linkme
      DATABASE_PASSWORD: linkme_secret
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      REDIS_BLOOM_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:8014

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: flake8
        run: flake8 .

      - name: Migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: pytest -q
