# LinkMe production stack
# Usage:
#   cp environment/production/.env.example environment/production/.env
#   docker compose -f docker/docker-compose.prod.yml --env-file environment/production/.env up -d --build
#
# Architecture:
#   Users → nginx → Next.js | Gunicorn API | Daphne WebSockets
#                 → PgBouncer → PostgreSQL
#                 → Redis (cache / Celery / Channels)

x-backend-env: &backend-env
  ENVIRONMENT: production
  DEBUG: "False"
  DATABASE_HOST: pgbouncer
  DATABASE_PORT: "6432"
  DATABASE_CONN_MAX_AGE: "0"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  REDIS_CELERY_URL: redis://redis:6379/2
  REDIS_CHANNELS_URL: redis://redis:6379/3
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-linkme_db}
      POSTGRES_USER: ${DATABASE_USER:-linkme}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/backup:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-linkme} -d ${DATABASE_NAME:-linkme_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - linkme-internal

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DATABASE_USER:-linkme}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-linkme_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - linkme-internal

  redis:
    # Redis Stack includes RedisBloom for username uniqueness checks.
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - linkme-internal

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file:
      - ../environment/production/.env
    environment:
      <<: *backend-env
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/liveness/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${WEB_CONCURRENCY:-5}
      - --threads=2
      - --timeout=60
      - --graceful-timeout=30
      - --keep-alive=5
      - --access-logfile=-
      - --error-logfile=-
    networks:
      - linkme-internal

  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file:
      - ../environment/production/.env
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8001"
      - config.asgi:application
    networks:
      - linkme-internal

  celery_default:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file:
      - ../environment/production/.env
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - default
      - --loglevel=info
      - --concurrency=4
    networks:
      - linkme-internal

  celery_media:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file:
      - ../environment/production/.env
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - media_processing
      - --loglevel=info
      - --concurrency=2
    networks:
      - linkme-internal

  celery_notifications:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file:
      - ../environment/production/.env
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - notifications,exports,cleanup
      - --loglevel=info
      - --concurrency=4
    networks:
      - linkme-internal

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.prod
    restart: unless-stopped
    env_file:
      - ../environment/production/.env
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --scheduler
      - celery.beat:PersistentScheduler
    networks:
      - linkme-internal

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - linkme-internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.http.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - websocket
      - frontend
    networks:
      - linkme-internal

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  linkme-internal:
    driver: bridge
    name: linkme-prod
